name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  posix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Bash and integrity
        shell: bash
        run: |
          set -eu
          bash -n plugins/machine-utilities/scripts/machine-utilities
          bash -n plugins/machine-utilities/scripts/collect-posix
          bash -n plugins/machine-utilities/scripts/test-machine-utilities
          bash -n plugins/machine-utilities/scripts/update-integrity
          if [[ "$RUNNER_OS" == Linux ]]; then
            shellcheck --severity=warning plugins/machine-utilities/scripts/machine-utilities \
              plugins/machine-utilities/scripts/collect-posix \
              plugins/machine-utilities/scripts/test-machine-utilities \
              plugins/machine-utilities/scripts/update-integrity
          fi
          plugins/machine-utilities/scripts/update-integrity
          git diff --exit-code -- plugins/machine-utilities/integrity.json
      - name: Run fixture suite
        shell: bash
        run: |
          chmod -R go-w plugins/machine-utilities
          plugins/machine-utilities/scripts/test-machine-utilities

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate PowerShell native boundaries and release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "plugins/machine-utilities/scripts/collect-windows.ps1",
            "plugins/machine-utilities/scripts/apply-windows.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw ($errors -join "`n") }
          }
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            "plugins/machine-utilities/scripts/apply-windows.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows native boundary self-test failed" }
          $root = Resolve-Path "plugins/machine-utilities"
          $integrity = Get-Content "$root/integrity.json" -Raw | ConvertFrom-Json
          foreach ($file in @($integrity.files)) {
            $actual = (Get-FileHash (Join-Path $root $file.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $file.sha256) { throw "Integrity mismatch: $($file.path)" }
          }
          $requirementPath = Join-Path $env:RUNNER_TEMP "machine-utilities-executor.json"
          try {
            [ordered]@{
              schema = "machine-utilities.executor"
              schema_version = 1
              plugin = $integrity.plugin
              marketplace = $integrity.marketplace
              version = $integrity.version
              integrity_manifest_sha256 = (
                Get-FileHash (Join-Path $root "integrity.json") -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              files = @($integrity.files)
            } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $requirementPath -Encoding utf8NoBOM
            $verified = & pwsh -NoLogo -NoProfile -NonInteractive -File `
              "plugins/machine-utilities/scripts/apply-windows.ps1" `
              -VerifyExecutor -ExecutorRequirementPath $requirementPath |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $verified.verified -ne $true) {
              throw "Native executor verification failed"
            }
          } finally {
            Remove-Item -LiteralPath $requirementPath -Force -ErrorAction SilentlyContinue
          }
